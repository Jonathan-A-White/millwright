# A drop-in for the Laptop's postern-backend.service (mw-gq6.1571): the backend the
# Governor's phone reads through gets the CPU before the test runners do. On
# 2026-11-20 at ~21:09Z, with Builders' builds holding the Laptop at load 25 to 30
# of 20 cores, mw postern send's GET /api/messages ended in "context deadline
# exceeded" and his phone fell to "Live from the chain"; a minute later the same
# backend answered /api/me in 0.25 s. It was starved, not down.
#
# CPUWeight, not Nice=-n: a user unit may not lower its own niceness without root,
# and the cpu controller is delegated to the user manager on the hosts that run
# the unit (cat /sys/fs/cgroup/user.slice/user-<uid>.slice/user@<uid>.service/cgroup.controllers).
# The weight is the same ten times the default that dolt-beads has
# (contrib/dolt-beads/priority.conf).
#
# Install on the host that runs the backend, from the rig's checkout:
#   sh scripts/install-dolt-priority.sh postern-backend    (--dry-run says what it would do)
# It copies this file to ~/.config/systemd/user/postern-backend.service.d/, reloads,
# restarts postern-backend and reads the weight back (CPUWeight=1000), failing when
# it does not read back.
#
# To see the weight at work, under load: run the request as
#   contrib/mw-under-load curl -s -o /dev/null -w '%{time_total}\n' http://<backend>/api/messages
# ten times (MW_UNDER_LOAD_CORES and MW_UNDER_LOAD_MAX raise the loops on a host that
# is idle: see the header of contrib/mw-under-load); each answers in under 2 s.
[Service]
CPUWeight=1000
