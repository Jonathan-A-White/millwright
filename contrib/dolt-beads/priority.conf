# A drop-in for the Laptop's dolt-beads.service (mw-gq6.1294): the served beads gets
# the CPU before the test runners do. A gate, a shots run and two Builders' tests
# held the Laptop's load at 2 to 5 times its cores for hours, and mw's own reads of
# the stories timed out ("read of the stories failed (i/o timeout)") while dolt
# sat at one saturated thread. The runners are niced (builder_nice) and capped
# (builder_jobs); this puts the server ten times above the default weight.
#
# CPUWeight, not Nice=-n: a user unit may not lower its own niceness without root,
# and the cpu controller is delegated to the user manager on the hosts that run
# the unit (cat /sys/fs/cgroup/user.slice/user-<uid>.slice/user@<uid>.service/cgroup.controllers).
#
# Install on the host that serves the beads:
#   mkdir -p ~/.config/systemd/user/dolt-beads.service.d
#   cp contrib/dolt-beads/priority.conf ~/.config/systemd/user/dolt-beads.service.d/
#   systemctl --user daemon-reload && systemctl --user restart dolt-beads
# Read it back: systemctl --user show dolt-beads -p CPUWeight   (CPUWeight=1000)
[Service]
CPUWeight=1000
